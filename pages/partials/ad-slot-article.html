<aside
  class="ad-slot article-ad article-ad--{{ARTICLE_AD_POSITION}}"
  aria-label="Advertisement"
  data-ad-slot="article-{{ARTICLE_SLUG}}-{{ARTICLE_AD_POSITION}}"
  data-ad-feature-enabled="{{AD_FEATURE_ENABLED}}"
  data-ad-consent="unknown"
  data-ad-provider="{{AD_PROVIDER}}"
  data-ad-unit-key="{{ARTICLE_AD_UNIT_KEY}}"
  data-ad-desktop-only="{{ARTICLE_AD_DESKTOP_ONLY}}"
  data-ad-state="{{AD_INITIAL_STATE}}"
  {{AD_HIDDEN_ATTRIBUTE}}
>
  <div class="ad-slot__container">
    <p class="ad-slot__label" aria-hidden="true">Advertisement</p>
    <div class="ad-slot__frame" data-ad-container>
      <p class="ad-slot__placeholder" aria-hidden="true">Reserved advertising space</p>
    </div>
  </div>
</aside>
