<li class="category-tile" data-category-slug="{{CATEGORY_SLUG}}">
  <a class="category-tile__link" href="/categories/{{CATEGORY_SLUG}}/">
    <span class="category-tile__icon" aria-hidden="true">
      <i class="fa-solid {{CATEGORY_ICON}}"></i>
    </span>
    <div class="category-tile__content">
      <h3 class="category-tile__title">{{CATEGORY_NAME}}</h3>
      <p class="category-tile__description">{{CATEGORY_DESCRIPTION}}</p>
    </div>
    <span class="category-tile__action" aria-hidden="true">
      Browse articles
      <i class="fa-solid fa-arrow-right"></i>
    </span>
  </a>
</li>
